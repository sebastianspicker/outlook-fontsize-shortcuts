name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lua:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    name: Lua quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LUAROCKS_TREE: ./.luarocks
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.4.6"

      - name: Unit tests
        run: |
          set -euo pipefail
          lua test/attempt_test.lua

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Cache LuaRocks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ./.luarocks
            ~/.cache/luarocks
          key: ${{ runner.os }}-luarocks-${{ hashFiles('Makefile', '.luacheckrc', '.stylua.toml') }}
          restore-keys: |
            ${{ runner.os }}-luarocks-

      - name: Format check (StyLua)
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.3.1"
          args: --check .

      - name: Install tools
        run: |
          set -euo pipefail
          make tools

      - name: Lint
        run: |
          set -euo pipefail
          make lint
